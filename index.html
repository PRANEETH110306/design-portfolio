    opacity: 0;

        opacity: 0;
    }

    15% {
        opacity: 0.8;
    }

    75% {

INITS.about = function (root, host) {


/* =========================================================
   SIMULTANEOUS TYPEWRITER
========================================================= */

const typeTexts =
    root.querySelectorAll(
        ".type-text"
    );


const typeSpeed = 18;


/*
    All paragraphs begin at exactly
    the same time.
*/

function startSimultaneousTypewriter() {

    typeTexts.forEach(
        (element) => {

            const text =
                element.dataset.text;

            let index = 0;


            element.textContent = "";

            element.classList.remove(
                "finished"
            );


            function write() {

                if (
                    index <
                    text.length
                ) {

                    element.textContent +=
                        text.charAt(index);

                    index++;


                    setTimeout(
                        write,
                        typeSpeed
                    );

                }

                else {

                    element.classList.add(
                        "finished"
                    );

                }

            }


            write();

        }
    );

}


/* =========================================================
   START TYPEWRITER
========================================================= */

setTimeout(
    startSimultaneousTypewriter,
    1250
);



/* =========================================================
   MOUSE PARALLAX
========================================================= */

const about =
    root.querySelector(
        ".about"
    );


const circle =
    root.querySelector(
        ".red-circle"
    );


const ring =
    root.querySelector(
        ".circle-ring"
    );


const character =
    root.querySelector(
        ".character"
    );


about.addEventListener(
    "mousemove",
    (event) => {

        const rect =
            about.getBoundingClientRect();


        const x =
            (
                event.clientX -
                rect.left
            ) / rect.width;


        const y =
            (
                event.clientY -
                rect.top
            ) / rect.height;


        const moveX =
            (x - 0.5) * 12;


        const moveY =
            (y - 0.5) * 8;


        /* RED CIRCLE */

        circle.style.transform =
            `
            translate(
                calc(
                    -50% +
                    ${moveX}px
                ),
                calc(
                    -50% +
                    ${moveY}px
                )
            )
            scale(1)
            `;


        /* OUTER RING */

        ring.style.transform =
            `
            translate(
                calc(
                    -50% +
                    ${moveX * 0.5}px
                ),
                calc(
                    -50% +
                    ${moveY * 0.5}px
                )
            )
            `;


        /* CHARACTER */

        character.style.transform =
            `
            translateX(
                calc(
                    -50% +
                    ${moveX * 0.35}px
                )
            )
            translateY(
                ${moveY * 0.25}px
            )
            `;

    }
);



/* =========================================================
   RESET PARALLAX
========================================================= */

about.addEventListener(
    "mouseleave",
    () => {

        circle.style.transform =
            `
            translate(
                -50%,
                -50%
            )
            scale(1)
            `;


        ring.style.transform =
            `
            translate(
                -50%,
                -50%
            )
            `;


        character.style.transform =
            `
            translateX(-50%)
            translateY(0)
            `;

    }
);


};
INITS.work = function (root, host) {



        /* =====================================================
           HORIZONTAL DRAG SCROLL
        ====================================================== */

        const tracks =
            root.querySelectorAll(
                ".work-track"
            );


        tracks.forEach(track => {


            let isDown = false;

            let startX = 0;

            let initialScroll = 0;


            track.addEventListener(
                "mousedown",
                event => {


                    if (
                        event.target.closest(
                            ".view-details"
                        )
                    ) {

                        return;

                    }


                    isDown = true;

                    track.classList.add(
                        "dragging"
                    );


                    startX =
                        event.pageX -
                        track.offsetLeft;


                    initialScroll =
                        track.scrollLeft;

                }
            );


            track.addEventListener(
                "mouseup",
                () => {

                    isDown = false;

                    track.classList.remove(
                        "dragging"
                    );

                }
            );


            track.addEventListener(
                "mouseleave",
                () => {

                    isDown = false;

                    track.classList.remove(
                        "dragging"
                    );

                }
            );


            track.addEventListener(
                "mousemove",
                event => {


                    if (!isDown) {

                        return;

                    }


                    event.preventDefault();


                    const currentX =
                        event.pageX -
                        track.offsetLeft;


                    const distance =
                        (currentX - startX)
                        * 1.5;


                    track.scrollLeft =
                        initialScroll -
                        distance;

                }
            );


            /* =================================================
               MOUSE WHEEL
            ================================================= */

            track.addEventListener(
                "wheel",
                event => {


                    if (
                        Math.abs(
                            event.deltaY
                        ) >
                        Math.abs(
                            event.deltaX
                        )
                    ) {


                        event.preventDefault();


                        track.scrollLeft +=

            );

        /* =====================================================

        ====================================================== */

        const canvas =

            );


        const ctx =

                "2d"
            );


        let canvasWidth;

        let canvasHeight;

        let particles = [];


        function resizeCanvas() {


            canvasWidth =
                window.innerWidth;


            canvasHeight =
                window.innerHeight;


            const ratio =
                window.devicePixelRatio || 1;


            canvas.width =
                canvasWidth * ratio;


            canvas.height =
                canvasHeight * ratio;


            canvas.style.width =
                canvasWidth + "px";


            canvas.style.height =
                canvasHeight + "px";


            ctx.setTransform(
                ratio,
                0,
                0,
                ratio,
                0,
                0
            );

        }


        resizeCanvas();


        window.addEventListener(
            "resize",
            resizeCanvas
        );



        /* =====================================================
           PARTICLE CLASS
        ====================================================== */

        class Particle {


            constructor() {

                this.reset(true);

            }


            reset(initial = false) {


                this.x =
                    Math.random()
                    * canvasWidth;


                this.y =

                    initial

                        ? Math.random()
                          * canvasHeight

                        : canvasHeight + 20;


                this.size =
                    Math.random()
                    * 2 + .4;


                this.speed =
                    Math.random()
                    * 1.1 + .25;


                this.drift =
                    (Math.random() - .5)
                    * .5;


                this.alpha =
                    Math.random()
                    * .4 + .08;


                this.life =
                    Math.random();

            }


            update() {


                this.y -=
                    this.speed;


                this.x +=
                    this.drift;


                this.life +=
                    .007;


                if (
                    this.y < -20 ||
                    this.life > 1
                ) {

                    this.reset();

                }

            }


            draw() {


                const fade =
                    Math.max(
                        0,
                        1 - this.life
                    );


                ctx.save();


                ctx.globalAlpha =
                    this.alpha *
                    fade;


                ctx.beginPath();


                ctx.arc(
                    this.x,
                    this.y,
                    this.size,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    "rgba(255,255,255,.8)";


                ctx.fill();


                ctx.restore();

            }

        }



        /* =====================================================
           CREATE PARTICLES
        ====================================================== */

        const particleCount =
            window.innerWidth < 700
                ? 45
                : 100;


        for (

        ) {

            );

        }



        /* =====================================================
           PARTICLE ANIMATION
        ====================================================== */

        function animateParticles() {


            ctx.clearRect(
                0,
                0,
                canvasWidth,
                canvasHeight
            );


            particles.forEach(
                particle => {

                    particle.update();

                    particle.draw();

                }
            );


            requestAnimationFrame(
                animateParticles
            );

INITS.contact = function (root, host) {


/* ==========================================
   EMBER PARTICLES
========================================== */

const emberLayer = root.getElementById("emberLayer");

for (let i = 0; i < 24; i++) {

    const ember = document.createElement("span");

    ember.className = "ember";

    ember.style.left = Math.random() * 100 + "%";

    ember.style.animationDuration =
        (8 + Math.random() * 12) + "s";

    ember.style.animationDelay =
        (Math.random() * 12) + "s";

    const size = 2 + Math.random() * 3;

    ember.style.width = size + "px";
    ember.style.height = size + "px";

    emberLayer.appendChild(ember);

}


/* ==========================================
   CINEMATIC SCROLL TRANSITION
========================================== */

const eyesBackground =
    root.querySelector(".dragon-eyes-bg");

const fullDragonBackground =
    root.querySelector(".dragon-full-bg");

const contactSection =
    root.querySelector(".contact-section");


let ticking = false;


function updateCinematicBackground() {

    const contactPosition =
        contactSection.getBoundingClientRect();

    const viewportHeight = window.innerHeight;


    /*
       Start transition as contact section
       approaches the lower part of viewport.
    */

    const transitionStart = viewportHeight * 0.85;

    const transitionEnd = viewportHeight * 0.10;


    let progress =
        (transitionStart - contactPosition.top) /
        (transitionStart - transitionEnd);


    progress = Math.max(0, Math.min(1, progress));


    /*
       Smoothstep easing.
    */

    const smoothProgress =
        progress * progress * (3 - 2 * progress);


    /*
       Crossfade the two images.
    */

    eyesBackground.style.opacity =
        1 - smoothProgress;

    fullDragonBackground.style.opacity =
        smoothProgress;


    ticking = false;

}


function requestBackgroundUpdate() {

    if (!ticking) {

        requestAnimationFrame(updateCinematicBackground);

        ticking = true;

    }

}


window.addEventListener(
    "scroll",
    requestBackgroundUpdate,
    { passive: true }
);

window.addEventListener(
    "resize",
    requestBackgroundUpdate
);


/* Initial state */

updateCinematicBackground();


/* ==========================================
   CONTACT FORM
========================================== */

const contactForm =
    root.getElementById("contactForm");


contactForm.addEventListener("submit", function(event) {

    event.preventDefault();


    const name =
        root.getElementById("name").value.trim();

    const email =
        root.getElementById("email").value.trim();

    const category =
        root.getElementById("category").value;

    const subject =
        root.getElementById("subject").value.trim();

    const message =
        root.getElementById("message").value.trim();


    const recipient = "praneethpark@gmail.com";


    const emailSubject = encodeURIComponent(
        subject + " | " + category
    );


    const emailBody = encodeURIComponent(

        "Name: " + name + "\n" +

        "Email: " + email + "\n" +

        "Category: " + category + "\n\n" +

        "Message:\n" + message

    );


    window.location.href =
        `mailto:${recipient}?subject=${emailSubject}&body=${emailBody}`;

});


};

/* Each section is mounted the moment it scrolls into view, so its own
   animations and scripts run exactly as they do in the standalone page. */
function mount(host) {
  const name = host.dataset.section;
  const root = host.attachShadow({ mode: "open" });
  root.append(document.getElementById("tpl-" + name).content.cloneNode(true));
  new IntersectionObserver(es => es.forEach(e => host.classList.toggle("on-screen", e.isIntersecting))).observe(host);
  try { INITS[name](root, host); } catch (err) { console.error("Section failed:", name, err); }
}
const lazy = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { lazy.unobserve(e.target); mount(e.target); }
}), { rootMargin: "0px 0px -30% 0px" });
document.querySelectorAll("[data-section]").forEach(h => lazy.observe(h));
</script>
</body>
